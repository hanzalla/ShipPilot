# version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: shippilot_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shippilot
      MYSQL_USER: shippilot_user
      MYSQL_PASSWORD: shippilot_pass
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: shippilot_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '3009:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
