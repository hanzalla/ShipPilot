<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShipPilot — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-box">

    <div class="login-logo">
      <div class="login-logo__icon">SP</div>
      <span class="login-logo__name">ShipPilot</span>
    </div>

    <div class="login-card">
      <h2>Sign in</h2>
      <p>Ship your code with confidence.</p>

      <div id="alert-area"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" style="width:100%">
          Sign in
        </button>
      </form>

      <div class="login-footer">
        Don't have an account?
        <a href="register.html">Create one</a>
      </div>
    </div>

    <div style="text-align:center; margin-top: var(--space-5);">
      <span class="text-xs text-faint">From Commit to Cloud &mdash; ShipPilot</span>
    </div>

  </div>
</div>

<script type="module" src="js/pages/login.js"></script>
</body>
</html>
