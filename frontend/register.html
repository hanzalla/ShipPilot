<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShipPilot — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-box">

    <div class="login-logo">
      <div class="login-logo__icon">SP</div>
      <span class="login-logo__name">ShipPilot</span>
    </div>

    <div class="login-card">
      <h2>Create account</h2>
      <p>Start shipping with confidence.</p>

      <div id="alert-area"></div>

      <form class="login-form" id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input class="form-input" type="text" id="name" name="name"
                 placeholder="Hanzalla Muzaffar" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="Min 8 characters" autocomplete="new-password" required />
          <span class="form-hint">At least 8 characters</span>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="submit-btn" style="width:100%">
          Create account
        </button>
      </form>

      <div class="login-footer">
        Already have an account?
        <a href="index.html">Sign in</a>
      </div>
    </div>

  </div>
</div>

<script type="module" src="js/pages/register.js"></script>
</body>
</html>
